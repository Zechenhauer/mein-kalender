<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Farbverlauf -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c2e" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <!-- Edler Gold-Farbverlauf für Akzente -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8c2c" />
    </linearGradient>
    <!-- Schatten für Tiefe -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App-Icon Hintergrund mit abgerundeten Ecken (iOS / Android Standard) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8" filter="url(#shadow)" />

  <!-- Kalenderblatt Hauptkörper -->
  <rect x="96" y="140" width="320" height="290" rx="36" fill="#1e293b" stroke="#d4af37" stroke-width="6" />

  <!-- Kalenderkopf (Goldener Balken oben) -->
  <path d="M 132 140 L 380 140 C 400 140, 416 156, 416 176 L 416 220 L 96 220 L 96 176 C 96 156, 112 140, 132 140 Z" fill="url(#goldGrad)" />

  <!-- Aufhänge-Ösen (Binder-Ringe oben) -->
  <rect x="170" y="96" width="32" height="64" rx="16" fill="url(#goldGrad)" />
  <rect x="310" y="96" width="32" height="64" rx="16" fill="url(#goldGrad)" />

  <!-- Kleiner Indikator-Punkt im oberen Balken -->
  <circle cx="256" cy="180" r="10" fill="#0b0f19" />

  <!-- Kalender-Datum (Stylische Ziffer "26" passend zu deinem Jahr 2026) -->
  <text x="256" y="345" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="110" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">26</text>

  <!-- Kleine dekorative Termin-Linien im unteren Bereich -->
  <rect x="150" y="375" width="120" height="12" rx="6" fill="#d4af37" opacity="0.8" />
  <rect x="150" y="397" width="80" height="10" rx="5" fill="#94a3b8" opacity="0.4" />
</svg>