<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jürgen Schützendorf — Smart Calendar</title>
  <!-- FullCalendar CSS -->
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131c2e;
      --bg-hover: #1e293b;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #d4af37; /* Edles Gold/Amber */
      --accent-glow: rgba(212, 175, 55, 0.15);
      --danger: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header Bereich */
    header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px 32px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .header-title p {
      margin: 4px 0 0 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .header-title span {
      color: var(--accent);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
      color: #0b0f19;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .btn-secondary-action {
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-secondary-action:hover {
      border-color: var(--accent);
    }

    /* Kategorien Filterleiste & Heute Button */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 16px 24px;
      border-radius: var(--radius);
      align-items: center;
      justify-content: space-between;
    }

    .category-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .chip:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .chip.active {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-today-jump {
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-today-jump:hover {
      border-color: var(--accent);
    }

    /* Karten-Container */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* Modernisiertes FullCalendar Design */
    .fc {
      --fc-border-color: var(--border-color);
      --fc-page-bg-color: transparent;
      --fc-neutral-bg-color: rgba(255, 255, 255, 0.02);
      --fc-list-event-hover-bg-color: var(--bg-hover);
      --fc-today-bg-color: transparent !important;
      font-family: inherit;
    }

    .fc-day-today {
      border: 2px solid var(--accent) !important;
      position: relative;
      z-index: 2;
    }

    .fc-toolbar-title {
      color: var(--text-main);
      font-size: 1.3rem !important;
      font-weight: 600;
    }

    .fc-button-primary {
      background-color: var(--bg-hover) !important;
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
      font-weight: 500 !important;
      padding: 10px 16px !important;
      border-radius: 8px !important;
      transition: all 0.2s;
    }

    .fc-button-primary:hover {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #0b0f19 !important;
    }

    .fc-button-active {
      background-color: var(--accent) !important;
      color: #0b0f19 !important;
      border-color: var(--accent) !important;
    }

    .fc-col-header-cell-cushion, .fc-daygrid-day-number {
      color: var(--text-muted);
      font-weight: 500;
      text-decoration: none;
    }

    .fc-daygrid-day-number {
      padding: 10px !important;
    }

    .fc-day-today .fc-daygrid-day-number {
      color: var(--accent);
      font-weight: 700;
    }

    .fc-day-has-events {
      background-color: rgba(59, 130, 246, 0.06) !important;
    }

    .fc-event {
      border: none !important;
      font-weight: 600 !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Modal / Popup Design */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 32px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      margin: 0 0 20px 0;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"], 
    .form-group input[type="datetime-local"], 
    .form-group input[type="date"], 
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-title">
        <h1>Smart Calendar</h1>
        <p>Persönlicher Kalender von <span>Jürgen Schützendorf</span></p>
      </div>
      <div class="header-actions">
        <input type="file" id="icalFileInput" accept=".ics" style="display:none" onchange="prepareIcalImport(event)">
        <button class="btn-secondary-action" onclick="document.getElementById('icalFileInput').click()">
          📥 Google iCal importieren (ab Nov 2026)
        </button>
        <button class="btn-primary" onclick="openNewEventModal()">
          <span>+</span> Neuer Termin
        </button>
      </div>
    </header>

    <!-- Kategorien Filterleiste & Heute Button -->
    <div class="filter-bar">
      <div class="category-chips">
        <div class="chip active" onclick="filterByCategory('Alle', this)">
          <span class="dot" style="background: linear-gradient(135deg, #3b82f6, #d4af37, #ff007f, #10b981);"></span>Alle
        </div>
        <div class="chip" onclick="filterByCategory('Silke', this)"><span class="dot" style="background:#ff007f;"></span>Silke</div>
        <div class="chip" onclick="filterByCategory('Privat', this)"><span class="dot" style="background:#3b82f6;"></span>Privat</div>
        <div class="chip" onclick="filterByCategory('TV Kapellen', this)"><span class="dot" style="background:#d4af37;"></span>TV Kapellen</div>
        <div class="chip" onclick="filterByCategory('Geburtstage', this)"><span class="dot" style="background:#ec4899;"></span>Geburtstage</div>
        <div class="chip" onclick="filterByCategory('Doppelkopf', this)"><span class="dot" style="background:#10b981;"></span>Doppelkopf</div>
        <div class="chip" onclick="filterByCategory('Eisen Krämer', this)"><span class="dot" style="background:#f97316;"></span>Eisen Krämer</div>
        <div class="chip" onclick="filterByCategory('Fussball', this)"><span class="dot" style="background:#06b6d4;"></span>Fussball</div>
      </div>
      <button class="btn-today-jump" onclick="jumpToToday()">📅 Heute</button>
    </div>

    <!-- Kalender Karte -->
    <div class="card">
      <div id='calendar'></div>
    </div>
  </div>

  <!-- Termin Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Termin hinzufügen</h3>
      <input type="hidden" id="eventId">
      <div class="form-group">
        <label>Titel</label>
        <input type="text" id="eventTitleInput" placeholder="z.B. Ligaspiel / Treffen">
      </div>
      <div class="form-group">
        <label>Kategorie</label>
        <select id="eventCategorySelect" onchange="onCategoryChange()">
          <option value="Silke">Silke</option>
          <option value="Privat">Privat</option>
          <option value="TV Kapellen">TV Kapellen</option>
          <option value="Geburtstage">Geburtstage</option>
          <option value="Doppelkopf">Doppelkopf</option>
          <option value="Eisen Krämer">Eisen Krämer</option>
          <option value="Fussball">Fussball</option>
        </select>
      </div>
      <div class="form-group">
        <label>Wiederholung</label>
        <select id="eventRecurrenceSelect">
          <option value="none">Keine Wiederholung</option>
          <option value="weekly">Wöchentlich</option>
          <option value="monthly">Monatlich</option>
          <option value="yearly">Jährlich</option>
        </select>
      </div>
      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="allDayCheckbox" onchange="toggleAllDay()"> Ganztägiger Termin
        </label>
      </div>
      <div class="form-group" id="startGroup">
        <label id="startLabel">Startdatum & Uhrzeit</label>
        <input type="datetime-local" id="eventStartInput">
      </div>
      <div class="form-group" id="endGroup">
        <label id="endLabel">Enddatum & Uhrzeit</label>
        <input type="datetime-local" id="eventEndInput">
      </div>
      <div class="modal-actions">
        <button id="deleteBtn" class="btn-danger" style="display:none;" onclick="deleteEventModal()">Löschen</button>
        <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button class="btn-primary" onclick="saveEvent()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- iCal Datei Import Modal -->
  <div id="importModal" class="modal">
    <div class="modal-content">
      <h3>Google iCal-Import: Kategorie wählen</h3>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0;">Wähle die Kategorie. Es werden nur Termine **ab dem 1. November 2026** importiert:</p>
      <div class="form-group">
        <label>Ziel-Kategorie</label>
        <select id="importCategorySelect">
          <option value="Silke">Silke</option>
          <option value="Privat">Privat</option>
          <option value="TV Kapellen">TV Kapellen</option>
          <option value="Geburtstage">Geburtstage</option>
          <option value="Doppelkopf">Doppelkopf</option>
          <option value="Eisen Krämer">Eisen Krämer</option>
          <option value="Fussball">Fussball</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeImportModal()">Abbrechen</button>
        <button class="btn-primary" onclick="executeIcalImport()">Importieren</button>
      </div>
    </div>
  </div>

  <!-- FullCalendar & Supabase Logik -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://lhusylpjnujlqomougmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yXEueWILvAq-Vm2VfTuYyg_BIQeE1KK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const categoryColors = {
      "Silke": "#ff007f",        // Grelles Pink
      "Privat": "#3b82f6",       // Blau
      "TV Kapellen": "#d4af37",  // Gold/Amber
      "Geburtstage": "#ec4899",  // Pink/Magenta
      "Doppelkopf": "#10b981",   // Grün
      "Eisen Krämer": "#f97316", // Orange
      "Fussball": "#06b6d4"      // Cyan
    };

    let calendar;
    let currentEditingEvent = null;
    let pendingIcalText = '';
    let allEventsData = [];
    let activeCategoryFilter = 'Alle';

    document.addEventListener('DOMContentLoaded', async function() {
      var calendarEl = id => document.getElementById(id);

      const { data: dbEvents, error } = await supabaseClient.from('calendar_events').select('*');
      
      if (error) {
        console.error('Fehler beim Laden aus Supabase:', error.message);
      } else {
        allEventsData = dbEvents.map(ev => {
          let cat = ev.category && categoryColors[ev.category] ? ev.category : 'Privat';
          let col = categoryColors[cat];
          
          let eventObj = {
            id: ev.id,
            title: ev.title,
            start: ev.start,
            end: ev.end,
            allDay: ev.all_day !== undefined ? ev.all_day : true,
            backgroundColor: col,
            borderColor: col,
            extendedProps: { category: cat }
          };

          if (ev.rrule) {
            eventObj.rrule = ev.rrule;
          }
          return eventObj;
        });
      }

      calendar = new FullCalendar.Calendar(calendarEl('calendar'), {
        initialView: 'dayGridMonth',
        firstDay: 1, // Woche beginnt am Montag
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        locale: 'de',
        editable: true,
        selectable: true,
        events: allEventsData,
        select: function(info) {
          openNewEventModal(info.startStr, info.endStr, info.allDay);
        },
        eventClick: function(info) {
          openEditEventModal(info.event);
        },
        eventChange: async function(info) {
          await updateEventInSupabase(info.event);
          highlightDaysWithEvents();
        },
        datesSet: function() {
          highlightDaysWithEvents();
        }
      });

      calendar.render();
      highlightDaysWithEvents();
    });

    // Kategorie-Filter Funktion
    function filterByCategory(category, chipElement) {
      activeCategoryFilter = category;

      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      chipElement.classList.add('active');

      if (category === 'Alle') {
        calendar.removeAllEvents();
        calendar.addEventSource(allEventsData);
      } else {
        const filtered = allEventsData.filter(ev => ev.extendedProps.category === category);
        calendar.removeAllEvents();
        calendar.addEventSource(filtered);
      }
      highlightDaysWithEvents();
    }

    // Zum heutigen Tag springen
    function jumpToToday() {
      calendar.today();
    }

    // Funktion zum dezenten Markieren von Tagen mit Terminen
    function highlightDaysWithEvents() {
      document.querySelectorAll('.fc-daygrid-day').forEach(el => {
        el.classList.remove('fc-day-has-events');
      });

      const events = calendar.getEvents();
      events.forEach(ev => {
        if (!ev.start) return;
        
        let currentDate = new Date(ev.start);
        let endDate = ev.end ? new Date(ev.end) : new Date(ev.start);
        
        if (ev.allDay && ev.end) {
          endDate.setDate(endDate.getDate() - 1);
        }

        while (currentDate <= endDate) {
          let year = currentDate.getFullYear();
          let month = String(currentDate.getMonth() + 1).padStart(2, '0');
          let day = String(currentDate.getDate()).padStart(2, '0');
          let dateStr = `${year}-${month}-${day}`;

          let dayEl = document.querySelector(`.fc-daygrid-day[data-date="${dateStr}"]`);
          if (dayEl) {
            dayEl.classList.add('fc-day-has-events');
          }

          currentDate.setDate(currentDate.getDate() + 1);
        }
      });
    }

    function toggleAllDay() {
      const isAllDay = document.getElementById('allDayCheckbox').checked;
      const startInput = document.getElementById('eventStartInput');
      const endInput = document.getElementById('eventEndInput');
      
      let currentStartDate = startInput.value ? startInput.value.substring(0, 10) : new Date().toISOString().substring(0, 10);
      let currentEndDate = endInput.value ? endInput.value.substring(0, 10) : currentStartDate;

      startInput.type = isAllDay ? 'date' : 'datetime-local';
      endInput.type = isAllDay ? 'date' : 'datetime-local';

      if (isAllDay) {
        startInput.value = currentStartDate;
        endInput.value = currentEndDate;
      } else {
        startInput.value = currentStartDate + 'T07:00';
        endInput.value = currentEndDate + 'T13:00';
      }
    }

    function onCategoryChange() {
      const category = document.getElementById('eventCategorySelect').value;
      const isAllDay = document.getElementById('allDayCheckbox').checked;

      if (category === 'Eisen Krämer' && !isAllDay) {
        const startInput = document.getElementById('eventStartInput');
        const endInput = document.getElementById('eventEndInput');
        
        let currentDate = startInput.value ? startInput.value.substring(0, 10) : new Date().toISOString().substring(0, 10);
        
        startInput.value = currentDate + 'T07:00';
        endInput.value = currentDate + 'T13:00';
      }
    }

    function openNewEventModal(start = '', end = '', isAllDay = false) {
      currentEditingEvent = null;
      document.getElementById('modalTitle').innerText = 'Termin hinzufügen';
      document.getElementById('eventId').value = '';
      document.getElementById('eventTitleInput').value = '';
      document.getElementById('eventRecurrenceSelect').value = 'none';
      
      const defaultCategory = activeCategoryFilter === 'Alle' ? 'Silke' : activeCategoryFilter;
      document.getElementById('eventCategorySelect').value = defaultCategory;
      document.getElementById('deleteBtn').style.display = 'none';

      document.getElementById('allDayCheckbox').checked = isAllDay;
      
      const startInput = document.getElementById('eventStartInput');
      const endInput = document.getElementById('eventEndInput');
      
      startInput.type = isAllDay ? 'date' : 'datetime-local';
      endInput.type = isAllDay ? 'date' : 'datetime-local';

      const now = new Date();
      if (isAllDay) {
        startInput.value = start ? start.substring(0, 10) : now.toISOString().substring(0, 10);
        endInput.value = end ? end.substring(0, 10) : now.toISOString().substring(0, 10);
      } else {
        if (defaultCategory === 'Eisen Krämer') {
          let dateStr = start ? start.substring(0, 10) : now.toISOString().substring(0, 10);
          startInput.value = dateStr + 'T07:00';
          endInput.value = dateStr + 'T13:00';
        } else {
          startInput.value = start ? start.substring(0, 16) : formatLocalDateTime(now);
          endInput.value = end ? end.substring(0, 16) : formatLocalDateTime(new Date(now.getTime() + 60*60*1000));
        }
      }

      document.getElementById('eventModal').style.display = 'flex';
    }

    function openEditEventModal(event) {
      currentEditingEvent = event;
      document.getElementById('modalTitle').innerText = 'Termin bearbeiten';
      document.getElementById('eventId').value = event.id;
      document.getElementById('eventTitleInput').value = event.title;
      document.getElementById('eventCategorySelect').value = event.extendedProps.category || 'Silke';
      
      let recVal = 'none';
      if (event.rrule) {
        if (event.rrule.includes('FREQ=WEEKLY')) recVal = 'weekly';
        else if (event.rrule.includes('FREQ=MONTHLY')) recVal = 'monthly';
        else if (event.rrule.includes('FREQ=YEARLY')) recVal = 'yearly';
      }
      document.getElementById('eventRecurrenceSelect').value = recVal;
      document.getElementById('deleteBtn').style.display = 'inline-block';

      const isAllDay = event.allDay;
      document.getElementById('allDayCheckbox').checked = isAllDay;

      const startInput = document.getElementById('eventStartInput');
      const endInput = document.getElementById('eventEndInput');
      
      startInput.type = isAllDay ? 'date' : 'datetime-local';
      endInput.type = isAllDay ? 'date' : 'datetime-local';

      if (isAllDay) {
        startInput.value = event.startStr ? event.startStr.substring(0, 10) : '';
        let endDate = event.end ? new Date(event.end.getTime() - 86400000) : new Date(event.start);
        endInput.value = endDate.toISOString().substring(0, 10);
      } else {
        startInput.value = event.start ? event.start.toISOString().substring(0, 16) : '';
        endInput.value = event.end ? event.end.toISOString().substring(0, 16) : (event.start ? event.start.toISOString().substring(0, 16) : '');
      }

      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    function closeImportModal() {
      document.getElementById('importModal').style.display = 'none';
      pendingIcalText = '';
    }

    async function saveEvent() {
      const title = document.getElementById('eventTitleInput').value;
      const category = document.getElementById('eventCategorySelect').value;
      const recurrence = document.getElementById('eventRecurrenceSelect').value;
      const isAllDay = document.getElementById('allDayCheckbox').checked;
      let start = document.getElementById('eventStartInput').value;
      let end = document.getElementById('eventEndInput').value;

      if (!title) {
        alert('Bitte gib einen Titel ein.');
        return;
      }

      if (isAllDay && end) {
        let endDateObj = new Date(end);
        endDateObj.setDate(endDateObj.getDate() + 1);
        end = endDateObj.toISOString().substring(0, 10);
      } else if (!end) {
        end = start;
      }

      const color = categoryColors[category] || '#3b82f6';
      
      let rruleStr = null;
      if (recurrence === 'weekly') rruleStr = 'FREQ=WEEKLY';
      else if (recurrence === 'monthly') rruleStr = 'FREQ=MONTHLY';
      else if (recurrence === 'yearly') rruleStr = 'FREQ=YEARLY';

      if (currentEditingEvent) {
        currentEditingEvent.setProp('title', title);
        currentEditingEvent.setStart(start);
        currentEditingEvent.setEnd(end);
        currentEditingEvent.setAllDay(isAllDay);
        currentEditingEvent.setProp('backgroundColor', color);
        currentEditingEvent.setProp('borderColor', color);
        currentEditingEvent.setExtendedProp('category', category);

        const idx = allEventsData.findIndex(e => e.id === currentEditingEvent.id);
        if (idx !== -1) {
          allEventsData[idx] = {
            id: currentEditingEvent.id,
            title, start, end, allDay: isAllDay,
            backgroundColor: color, borderColor: color,
            extendedProps: { category },
            rrule: rruleStr
          };
        }

        await updateEventInSupabase(currentEditingEvent, rruleStr);
      } else {
        const newEventData = {
          id: '_' + Math.random().toString(36).substr(2, 9),
          title: title,
          start: start,
          end: end,
          all_day: isAllDay,
          category: category,
          background_color: color,
          border_color: color,
          rrule: rruleStr
        };

        allEventsData.push({
          id: newEventData.id,
          title: newEventData.title,
          start: newEventData.start,
          end: newEventData.end,
          allDay: newEventData.all_day,
          backgroundColor: newEventData.background_color,
          borderColor: newEventData.border_color,
          extendedProps: { category: newEventData.category },
          rrule: rruleStr
        });

        if (activeCategoryFilter === 'Alle' || activeCategoryFilter === category) {
          let evPayload = {
            id: newEventData.id,
            title: newEventData.title,
            start: newEventData.start,
            end: newEventData.end,
            allDay: newEventData.all_day,
            backgroundColor: newEventData.background_color,
            borderColor: newEventData.border_color,
            extendedProps: { category: newEventData.category }
          };
          if (rruleStr) evPayload.rrule = rruleStr;

          calendar.addEvent(evPayload);
        }

        await supabaseClient.from('calendar_events').insert([newEventData]);
      }

      highlightDaysWithEvents();
      closeModal();
    }

    async function updateEventInSupabase(event, rruleStr) {
      const category = event.extendedProps.category || 'Privat';
      const color = categoryColors[category] || '#3b82f6';
      
      await supabaseClient.from('calendar_events').update({
        title: event.title,
        start: event.startStr,
        end: event.endStr || event.startStr,
        all_day: event.allDay,
        category: category,
        background_color: color,
        border_color: color,
        rrule: rruleStr || null
      }).eq('id', event.id);
    }

    async function deleteEventModal() {
      if (currentEditingEvent && confirm('Möchtest du diesen Termin wirklich löschen?')) {
        await supabaseClient.from('calendar_events').delete().eq('id', currentEditingEvent.id);
        allEventsData = allEventsData.filter(e => e.id !== currentEditingEvent.id);
        currentEditingEvent.remove();
        highlightDaysWithEvents();
        closeModal();
      }
    }

    // iCal Datei Import vorbereiten
    function prepareIcalImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        pendingIcalText = e.target.result;
        document.getElementById('importModal').style.display = 'flex';
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // iCal Auswertung mit Unterstützung für ganztägige Termine und Filter ab Nov 2026
    async function executeIcalImport() {
      const selectedCategory = document.getElementById('importCategorySelect').value;
      if (!pendingIcalText) return;

      const lines = pendingIcalText.split(/\r\n|\n|\r/);
      let importedEvents = [];
      let currentEvent = null;

      const cutoffDate = new Date('2026-11-01T00:00:00');

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        while (i + 1 < lines.length && (lines[i + 1].startsWith(' ') || lines[i + 1].startsWith('\t'))) {
          i++;
          line += lines[i].trimStart();
        }

        if (line === 'BEGIN:VEVENT') {
          currentEvent = { title: 'Importierter Termin', start: '', end: '', allDay: false };
        } else if (line === 'END:VEVENT' && currentEvent) {
          if (currentEvent.start) {
            const eventDate = new Date(currentEvent.allDay ? currentEvent.start : currentEvent.start.substring(0, 10));
            
            if (eventDate >= cutoffDate) {
              if (!currentEvent.end) {
                currentEvent.end = currentEvent.start;
              }

              const color = categoryColors[selectedCategory] || '#3b82f6';
              const eventObj = {
                id: '_' + Math.random().toString(36).substr(2, 9),
                title: currentEvent.title,
                start: currentEvent.start,
                end: currentEvent.end,
                all_day: currentEvent.allDay,
                category: selectedCategory,
                background_color: color,
                border_color: color
              };

              importedEvents.push(eventObj);

              allEventsData.push({
                id: eventObj.id,
                title: eventObj.title,
                start: eventObj.start,
                end: eventObj.end,
                allDay: eventObj.all_day,
                backgroundColor: eventObj.background_color,
                borderColor: eventObj.border_color,
                extendedProps: { category: eventObj.category }
              });

              if (activeCategoryFilter === 'Alle' || activeCategoryFilter === selectedCategory) {
                calendar.addEvent({
                  id: eventObj.id,
                  title: eventObj.title,
                  start: eventObj.start,
                  end: eventObj.end,
                  allDay: eventObj.all_day,
                  backgroundColor: eventObj.background_color,
                  borderColor: eventObj.border_color,
                  extendedProps: { category: eventObj.category }
                });
              }
            }
          }
          currentEvent = null;
        } else if (currentEvent) {
          if (line.startsWith('SUMMARY:')) {
            currentEvent.title = line.substring(8).trim();
          } else if (line.startsWith('DTSTART')) {
            let parsed = parseIcalDate(line);
            currentEvent.start = parsed.dateStr;
            currentEvent.allDay = parsed.isAllDay;
          } else if (line.startsWith('DTEND')) {
            let parsed = parseIcalDate(line);
            currentEvent.end = parsed.dateStr;
          }
        }
      }

      if (importedEvents.length > 0) {
        await supabaseClient.from('calendar_events').insert(importedEvents);
        highlightDaysWithEvents();
        alert(`Erfolgreich ${importedEvents.length} aktuelle Termine (ab November 2026) gespeichert!`);
      } else {
        alert('Keine Termine ab November 2026 gefunden.');
      }

      closeImportModal();
    }

    function parseIcalDate(line) {
      const parts = line.split(':');
      if (parts.length < 2) return { dateStr: '', isAllDay: false };
      let val = parts[1].trim();

      if (val.length === 8) {
        let year = val.substring(0, 4);
        let month = val.substring(4, 6);
        let day = val.substring(6, 8);
        return { dateStr: `${year}-${month}-${day}`, isAllDay: true };
      } else if (val.length >= 15) {
        let year = parseInt(val.substring(0, 4));
        let month = parseInt(val.substring(4, 6)) - 1;
        let day = parseInt(val.substring(6, 8));
        let hour = parseInt(val.substring(9, 11));
        let minute = parseInt(val.substring(11, 13));
        let second = parseInt(val.substring(13, 15) || 0);

        let dateObj;
        if (val.endsWith('Z')) {
          dateObj = new Date(Date.UTC(year, month, day, hour, minute, second));
        } else {
          dateObj = new Date(year, month, day, hour, minute, second);
        }

        const tzOffset = dateObj.getTimezoneOffset() * 60000;
        const localDate = new Date(dateObj.getTime() - tzOffset);
        return { dateStr: localDate.toISOString().substring(0, 16), isAllDay: false };
      }
      return { dateStr: '', isAllDay: false };
    }

    function formatLocalDateTime(date) {
      const offset = date.getTimezoneOffset();
      const localDate = new Date(date.getTime() - (offset*60*1000));
      return localDate.toISOString().substring(0, 16);
    }
  </script>
